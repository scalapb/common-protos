name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [master]
    tags:
      - 'proto-google-common-protos/*'
      - 'proto-google-cloud-pubsub-v1/*'
      - 'proto-google-cloud-dataproc-v1/*'
      - 'pgv-proto/*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.21', '2.13.18', '3.3.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1
      - name: Formatting and release-script checks
        if: matrix.scala == '2.13.18'
        run: |
          sbt scalafmtSbtCheck
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Compile, inspect artifacts, and test independent consumers
        env:
          SCALA_VERSION: ${{ matrix.scala }}
        run: bash scripts/test.sh "$SCALA_VERSION"

  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix entry to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  publish:
    if: github.event_name == 'push'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: common-protos-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1
      - name: Publish snapshots or the selected release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        run: python3 scripts/release.py
