pullRequests.frequency = "7 days"

# Keep the stable and experimental generator/runtime pairs coordinated manually.
# A blanket ScalaPB upgrade would collapse the two published compatibility lines.
updates.ignore = [ { groupId = "com.thesamet.scalapb" } ]

updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." },
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." }
]

pullRequests.grouping = [
  {
    name = "google-protos"
    title = "Update Google proto libraries together"
    filter = [ { group = "com.google.api.grpc" } ]
  }
]
